      <text x="1184" y="65" fill="#8697B5" text-anchor="end" font-size="10" font-weight="500" letter-spacing="2.4">OPEN SOURCE</text>
      <g transform="translate(73 105) scale(1.24)">
        <path d="M96 40C89 29 77 23 64 23C42.5 23 25 40.5 25 62C25 83.5 42.5 101 64 101C78 101 91 93.5 98 82L82.5 72.5C78.5 79 72 83 64 83C52.4 83 43 73.6 43 62C43 50.4 52.4 41 64 41C71 41 77.5 44.5 81.5 50.5L96 40Z" fill="url(#silver)"/>
        <path d="M30.5 82C43 88.5 52 83 62 76.5L73 69.5C83 63 94 62.5 105 68L101 77C97.5 84.5 88.5 87.5 81 84L73 80C61 74 53 95 42 92.5C37.5 90 33.5 86.5 30.5 82Z" fill="url(#fold)"/>
        <path d="M30.5 80C43 86.5 52 81 62 74.5L73 67.5C83 61 94 60.5 105 66L102.5 71.5C99 79 90 82 82.5 78.5L75 75C62.5 69 52 91 42 90.5C37.5 88 33.5 84.5 30.5 80Z" fill="url(#ribbon)"/>
        <path d="M29 49C34.5 34 48 24 64 24C76 24 87 29.5 94.5 39.5" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1" stroke-linecap="round"/>
      </g>
      <text x="244" y="185" fill="#F1F5FD" font-size="66" font-weight="600" letter-spacing="-2.5">CloudReel</text>
      <text x="248" y="224" fill="#9EAECA" font-size="18" font-weight="400" letter-spacing=".6">Your library. Beautifully in sync.</text>
      <path d="M96 280H1184" stroke="#B4C7E7" stroke-opacity=".12"/>
      <text x="96" y="316" fill="#96A8C8" font-size="10" font-weight="500" letter-spacing="2">BAIDU NETDISK</text>
