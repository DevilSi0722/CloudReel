      <text x="275" y="316" fill="#96A8C8" font-size="10" font-weight="500" letter-spacing="2">TMDB</text>
      <circle cx="344" cy="312" r="1.5" fill="#576B8E"/>
      <text x="370" y="316" fill="#96A8C8" font-size="10" font-weight="500" letter-spacing="2">TRAKT</text>
      <text x="1184" y="316" fill="#7E91B2" text-anchor="end" font-size="10" font-weight="500" letter-spacing="2">BUILT FOR WINDOWS</text>
