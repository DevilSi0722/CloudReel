<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">CloudReel</title>
  <desc id="description">CloudReel, a Windows cinema client connecting Baidu Netdisk, TMDB and Trakt.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101828"/>
      <stop offset=".55" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#161E31"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(1000 110) rotate(122) scale(430 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#839DCB" stop-opacity=".14"/>
      <stop offset="1" stop-color="#839DCB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C3D4F0" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#C3D4F0" stop-opacity=".03"/>
      <stop offset="1" stop-color="#C3D4F0" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="silver" x1="40" y1="29" x2="89" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".4" stop-color="#EDF3FF"/><stop offset=".72" stop-color="#BFCDE7"/><stop offset="1" stop-color="#859BC4"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="39" y1="82" x2="105" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7C9EE"/><stop offset=".52" stop-color="#E6EEFF"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="fold" x1="77" y1="68" x2="91" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#718BB9"/><stop offset="1" stop-color="#C4D4EF"/>
    </linearGradient>
    <clipPath id="rounded"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
